name: Bug report
description: Something on the site doesn't work.
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://smacacademy.github.io/cl_dsa/...
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 131 on Android
