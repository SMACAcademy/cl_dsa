[project]
name = "algoverse"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "mypy", "jsonschema", "datamodel-code-generator"]

[tool.uv.workspace]
members = ["packages/content-tools", "packages/trace-schema"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = ["packages/content-tools/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
